<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Nomo 是一款本地优先、Markdown-first 的桌面编辑器，支持 macOS 与 Windows。"
    />
    <meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101216" media="(prefers-color-scheme: dark)" />
    <meta property="og:title" content="Nomo - Markdown-first desktop editor" />
    <meta
      property="og:description"
      content="本地优先的 Markdown 桌面编辑器，支持 macOS 与 Windows。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nomo-md.github.io/" />
    <link rel="canonical" href="https://nomo-md.github.io/" />
    <link rel="icon" type="image/png" href="./assets/nomo-logo.png" />
    <link rel="stylesheet" href="./styles.css" />
    <title>Nomo | Markdown-first desktop editor</title>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/" aria-label="Nomo 首页">
        <img src="./assets/nomo-logo.png" width="40" height="40" alt="" />
        <span>Nomo</span>
      </a>
      <nav aria-label="主要导航">
        <a href="https://github.com/nomo-md/nomo">GitHub</a>
        <a href="https://github.com/nomo-md/nomo/releases/latest">下载</a>
      </nav>
    </header>

    <main>
      <section class="hero">
        <div class="hero-copy">
          <p class="eyebrow">Markdown-first desktop editor</p>
          <h1>让写作回到<br />内容本身。</h1>
          <p class="lead">
            Nomo 是一款本地优先的桌面编辑器，在语义编辑与源码模式之间保持 Markdown 一致。
          </p>
          <div class="actions">
            <a class="button button-primary" href="https://github.com/nomo-md/nomo/releases/latest">
              获取 Nomo
            </a>
            <a class="button button-secondary" href="https://github.com/nomo-md/nomo">
              查看源代码
            </a>
          </div>
        </div>

        <figure class="product-visual">
          <img
            src="./assets/nomo-demo.gif"
            alt="Nomo 编辑 Markdown 文档的界面演示"
            width="1920"
            height="1080"
          />
        </figure>
      </section>

      <section class="facts" aria-label="产品特点">
        <div>
          <strong>本地优先</strong>
          <span>文档保存在自己的设备中</span>
        </div>
        <div>
          <strong>Markdown-first</strong>
          <span>Markdown 文本始终是文档主数据</span>
        </div>
        <div>
          <strong>macOS + Windows</strong>
          <span>为桌面写作与文件管理而设计</span>
        </div>
        <div>
          <strong>开源可见</strong>
          <span>在 GitHub 查看代码与开发进度</span>
        </div>
      </section>
    </main>

    <footer>
      <p>Nomo. Focus on the words.</p>
      <div>
        <a href="https://github.com/nomo-md/nomo/issues">反馈问题</a>
        <a href="https://github.com/nomo-md">项目主页</a>
      </div>
    </footer>
  </body>
</html>
